# AI review for pull requests -- the fleet's reusable, which deduplicates by
# head SHA instead of refusing `synchronize`. The state that merges gets
# reviewed; re-deliveries of an already-reviewed state skip the model. The
# review contract stays .github/review-guidelines.md.
#
# Comment-only and deliberately not a required status check: branch
# protection requires "PR Validation" from validate.yml, and a reviewer that
# can block a merge is a reviewer that gets worked around.
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai_review:
    name: AI Review
    uses: tsviser/crossroads-ci/.github/workflows/_ai-review.yml@b6f9db5ed0da86e581d255697b36c9fccbe8b99e # main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
