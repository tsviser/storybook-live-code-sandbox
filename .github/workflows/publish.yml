name: Publish package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install basic Storybook example
        run: npm ci --prefix examples/basic-storybook --no-audit --no-fund

      - name: Verify package
        run: npm run release:check

      - name: Build local-package Storybook consumer
        run: npm run example:build

      - name: Publish to npm
        run: npm publish --provenance --access public
