name: Publish package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check repository consistency
        run: node scripts/check-consistency.mjs --all

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install basic Storybook example
        run: npm install --prefix examples/basic-storybook --ignore-scripts --no-audit --no-fund

      - name: Verify authoritative lockfiles
        run: git diff --exit-code -- package-lock.json examples/basic-storybook/package-lock.json

      - name: Verify package
        run: npm run release:check

      - name: Build local-package Storybook consumer
        run: npm run example:build

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser sandbox tests
        run: npm run test:browser

      - name: Publish to npm
        run: npm publish --ignore-scripts --provenance --access public
