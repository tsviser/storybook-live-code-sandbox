name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # Merge-queue entries. Without this trigger a queued PR waits for the
  # required PR Validation check that never starts, and times out of the
  # queue. A queue entry runs the same suite as a push.
  merge_group:

permissions:
  contents: read

env:
  INSTALL_NPM_VERSION: 10.9.4

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check repository consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # ${BASE_SHA:+...}: a merge_group event carries neither field, and the
        # script rejects an empty --base. Omitting the flag falls back to its
        # origin/main default -- the right base for a queue entry, which is
        # main plus the queued PRs ahead of this one.
        run: node scripts/check-consistency.mjs ${BASE_SHA:+--base "$BASE_SHA"}

      - name: Select deterministic install npm
        run: npm install --global npm@${INSTALL_NPM_VERSION} --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install basic Storybook example
        run: npm install --prefix examples/basic-storybook --ignore-scripts --no-audit --no-fund

      - name: Verify authoritative lockfiles
        run: git diff --exit-code -- package-lock.json examples/basic-storybook/package-lock.json

      - name: Validate package and integration contract
        run: npm run release:check

      - name: Build local-package Storybook consumer
        run: npm run example:build

      - name: Check package and consumer bundle budgets
        run: npm run size:check

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser sandbox tests
        run: npm run test:browser

  compatibility:
    name: Compatibility (Node ${{ matrix.node }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            react: 18.3.1
            react_types: 18.3.31
            react_dom_types: 18.3.7
          - node: 22.12.0
            react: 19.2.8
            react_types: 19.2.18
            react_dom_types: 19.2.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Select deterministic install npm
        run: npm install --global npm@${INSTALL_NPM_VERSION} --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --prefix examples/basic-storybook --ignore-scripts --no-audit --no-fund

      - name: Verify authoritative lockfiles
        run: git diff --exit-code -- package-lock.json examples/basic-storybook/package-lock.json

      - name: Select React compatibility version
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react_types }} @types/react-dom@${{ matrix.react_dom_types }}
          npm install --prefix examples/basic-storybook --no-save --package-lock=false --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - name: Verify package and local Storybook consumer
        run: |
          npm test
          npm run build
          npm run example:build
          npm run size:check

  supply-chain:
    name: Supply chain
    # Phase 02: the fleet's shared supply-chain checks -- dependency review,
    # OSV scan, secret scan, npm audit -- from the control plane. Reusable
    # rather than composite because none of these job names are load-bearing;
    # only the aggregate gate's name is.
    uses: crossroads-hq/crossroads-ci/.github/workflows/_supply-chain.yml@b6d6ff2d2b709a42fb174c21f80549a95ddb1d56 # main
    permissions:
      contents: read
    with:
      npm-audit: true

  pr_validation:
    name: PR Validation
    # Aggregate gate; the name is the fleet's required check and never
    # changes. Logic lives in the control plane's composite action -- a
    # composite, not a reusable workflow, so this job's check context stays
    # intact. `needs` includes the matrix job as a whole, aggregating every
    # leg under one name, and the supply-chain reusable from Phase 02.
    if: ${{ !cancelled() }}
    needs: [validate, compatibility, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout: a remote composite is fetched by the runner, and this job
    # reads job results, not the repository.
    steps:
      - name: Check required results
        uses: crossroads-hq/crossroads-ci/actions/gate@b6d6ff2d2b709a42fb174c21f80549a95ddb1d56 # main
        with:
          results: |
            {
              "Validate": "${{ needs.validate.result }}",
              "Compatibility": "${{ needs.compatibility.result }}",
              "Supply chain": "${{ needs.supply-chain.result }}"
            }
