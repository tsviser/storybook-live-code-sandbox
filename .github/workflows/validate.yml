name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check repository consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-consistency.mjs --base "$BASE_SHA"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install basic Storybook example
        run: npm install --prefix examples/basic-storybook --ignore-scripts --no-audit --no-fund

      - name: Validate package and integration contract
        run: npm run release:check

      - name: Build local-package Storybook consumer
        run: npm run example:build

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser sandbox tests
        run: npm run test:browser
