name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  INSTALL_NPM_VERSION: 10.9.4

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check repository consistency
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-consistency.mjs --base "$BASE_SHA"

      - name: Select deterministic install npm
        run: npm install --global npm@${INSTALL_NPM_VERSION} --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install basic Storybook example
        run: npm install --prefix examples/basic-storybook --ignore-scripts --no-audit --no-fund

      - name: Verify authoritative lockfiles
        run: git diff --exit-code -- package-lock.json examples/basic-storybook/package-lock.json

      - name: Validate package and integration contract
        run: npm run release:check

      - name: Build local-package Storybook consumer
        run: npm run example:build

      - name: Check package and consumer bundle budgets
        run: npm run size:check

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser sandbox tests
        run: npm run test:browser

  compatibility:
    name: Compatibility (Node ${{ matrix.node }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            react: 18.3.1
            react_types: 18.3.31
            react_dom_types: 18.3.7
          - node: 22.12.0
            react: 19.2.8
            react_types: 19.2.18
            react_dom_types: 19.2.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Select deterministic install npm
        run: npm install --global npm@${INSTALL_NPM_VERSION} --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --prefix examples/basic-storybook --ignore-scripts --no-audit --no-fund

      - name: Verify authoritative lockfiles
        run: git diff --exit-code -- package-lock.json examples/basic-storybook/package-lock.json

      - name: Select React compatibility version
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react_types }} @types/react-dom@${{ matrix.react_dom_types }}
          npm install --prefix examples/basic-storybook --no-save --package-lock=false --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - name: Verify package and local Storybook consumer
        run: |
          npm test
          npm run build
          npm run example:build
          npm run size:check

  supply-chain:
    name: Supply chain
    # Phase 02: the fleet's shared supply-chain checks -- dependency review,
    # OSV scan, secret scan, npm audit -- from the control plane. Reusable
    # rather than composite because none of these job names are load-bearing;
    # only the aggregate gate's name is.
    uses: tsviser/crossroads-ci/.github/workflows/_supply-chain.yml@20ad5f774678414452201695c5f27017fa1f94f1 # main
    permissions:
      contents: read
    with:
      npm-audit: true

  pr_validation:
    name: PR Validation
    # Aggregate gate. Every Crossroads repository exposes one required status
    # check under this exact name, so the jobs beneath it can be renamed, split
    # or extended without touching the branch protection rule. GitHub stores a
    # required check as plain text rather than as a reference to a job, so a
    # rename made without updating the rule fails silently rather than loudly.
    #
    # `needs` deliberately includes `compatibility`. Its matrix legs report as
    # "Compatibility (Node 20.19.0, React 18.3.1)" and similar, so requiring
    # them individually would pin a Node and React pair into branch protection
    # and silently exempt any pair added later. Depending on the matrix job as a
    # whole aggregates every leg under one name.
    #
    # `!cancelled()` rather than `always()`: a run cancelled by hand should
    # render no verdict rather than leave a red required check behind. A job
    # cancelled on its own while its run stays live is a different case --
    # `cancelled()` is false there, so the gate still runs and the check below
    # still refuses to pass a job that did not finish.
    if: ${{ !cancelled() }}
    needs: [validate, compatibility, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout step: this job reads job results, not the repository.
      - name: Check required results
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          echo "Validate:      $VALIDATE_RESULT"
          echo "Compatibility: $COMPATIBILITY_RESULT"
          echo "Supply chain:  $SUPPLY_CHAIN_RESULT"
          status=0
          for pair in "Validate:$VALIDATE_RESULT" "Compatibility:$COMPATIBILITY_RESULT" "Supply chain:$SUPPLY_CHAIN_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            [ "$result" = "success" ] && continue
            if [ "$result" = "cancelled" ]; then
              echo "$name was cancelled while this run stayed live; a required job that did not finish cannot pass the gate." >&2
            else
              echo "$name did not pass ($result)." >&2
            fi
            status=1
          done
          exit "$status"
