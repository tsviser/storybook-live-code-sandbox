name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install basic Storybook example
        run: npm ci --prefix examples/basic-storybook --no-audit --no-fund

      - name: Validate package and integration contract
        run: npm run release:check

      - name: Build local-package Storybook consumer
        run: npm run example:build
